name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply D1 remote migrations before deploy
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_PLAY_ROUTE: ${{ secrets.CLOUDFLARE_PLAY_ROUTE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check
        run: npm run build

      - name: Inject production D1 database_id
        run: |
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "CLOUDFLARE_D1_DATABASE_ID secret is required."
            exit 1
          fi
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$CLOUDFLARE_D1_DATABASE_ID/g" wrangler.toml

      - name: Inject production route
        run: |
          if [ -z "$CLOUDFLARE_PLAY_ROUTE" ]; then
            echo "CLOUDFLARE_PLAY_ROUTE secret is required (example.com/.play*)."
            exit 1
          fi
          sed -i "s|REPLACE_WITH_YOUR_PLAY_ROUTE|$CLOUDFLARE_PLAY_ROUTE|g" wrangler.toml

      - name: Apply D1 migrations
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply_migrations == 'true') }}
        run: npm run d1:migrate:remote

      - name: Deploy Worker
        run: npx wrangler deploy
